<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Берсерк: Падение Сокола</title>
<style>
:root{
--ink:#0b0812;--ink2:#151022;--surf:#1c1428;--blood:#c1121f;--bloodhi:#e5383b;--blooddk:#5e0c12;
--gold:#e0a458;--goldhi:#ffd166;--steel:#5c7a99;--steelhi:#9db4c8;--steeldk:#26313f;
--violet:#7b2cbf;--violethi:#c77dff;--bone:#e8e3d5;--dim:#a89f8d;--ok:#7fb069;--warn:#e6a23c;--info:#6ea8d8;
--serif:Georgia,"Times New Roman","Noto Serif",serif;--sans:"Segoe UI",Verdana,"Noto Sans",Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--sans)}
*{scrollbar-width:thin;scrollbar-color:var(--blood) var(--ink2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--ink2)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blooddk),var(--blood));border:2px solid var(--ink2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--blood),var(--gold))}
::selection{background:var(--blood);color:#fff}
#bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;gap:12px;padding:0 16px;
background:linear-gradient(180deg,rgba(11,8,18,.97),rgba(11,8,18,.82));border-bottom:1px solid rgba(224,164,88,.32);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:28px;height:28px;flex:none;filter:drop-shadow(0 0 6px rgba(229,56,59,.6))}
.brand b{font-family:var(--serif);font-size:16px;letter-spacing:.15em;white-space:nowrap}
.brand i{display:block;font-style:normal;font-size:9px;letter-spacing:.28em;color:var(--gold);white-space:nowrap}
.sp{margin-left:auto}
.btn{background:rgba(21,16,34,.9);border:1px solid var(--steeldk);color:var(--dim);font-family:var(--sans);font-size:12.5px;
letter-spacing:.05em;padding:8px 13px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--goldhi);background:rgba(30,12,20,.95)}
.btn:active{transform:translateY(1px)}
.btn .d{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:none}
.btn.off .d{background:var(--steel);box-shadow:none}
.btn.gold{border-color:var(--gold);color:var(--goldhi)}
#wrap{position:fixed;top:52px;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 40%,#160b18,#07050d 75%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#toast{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.tst{background:rgba(21,16,34,.97);border:1px solid var(--gold);border-left:4px solid var(--ok);border-radius:4px;
padding:10px 15px;font-size:13px;box-shadow:0 8px 26px rgba(0,0,0,.6);animation:ti .28s;max-width:300px}
.tst small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
@keyframes ti{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media(max-width:640px){.brand i{display:none}.brand b{font-size:13px}.btn{padding:7px 9px;font-size:11.5px}#bar{gap:7px;padding:0 9px}}
</style>
</head>
<body>
<div id="bar">
<div class="brand">
<svg viewBox="0 0 128 128"><circle cx="64" cy="52" r="30" fill="none" stroke="#e5383b" stroke-width="7"/><circle cx="64" cy="52" r="26" fill="#050308"/><g stroke="#e0a458" stroke-width="3" stroke-linecap="round"><line x1="64" y1="8" x2="64" y2="17"/><line x1="20" y1="52" x2="29" y2="52"/><line x1="99" y1="52" x2="108" y2="52"/><line x1="33" y1="21" x2="39" y2="27"/><line x1="95" y1="21" x2="89" y2="27"/></g><g stroke="#c1121f" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="64" cy="98" r="7"/><path d="M55 104 L73 104 L64 118 Z"/><line x1="64" y1="118" x2="64" y2="125"/></g></svg>
<span><b>БЕРСЕРК</b><i>ПАДЕНИЕ СОКОЛА</i></span>
</div>
<div class="sp"></div>
<button class="btn" id="bSnd"><span class="d"></span><span id="sndL">Звук: вкл</span></button>
<button class="btn" id="bPause">Пауза</button>
<button class="btn gold" id="bDl">↓ Скачать игру</button>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="toast"></div>
<script>
(function(){
"use strict";
/* ================= основа ================= */
var W=1280,H=720,AW=1600,AH=900,AX0=70,AX1=1530,AY0=450,AY1=850;
var GATE={x:1465,y:645};
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var scale=1,offx=0,offy=0,dpr=1;
var C={ink:'#0b0812',ink2:'#151022',blood:'#c1121f',bloodHi:'#e5383b',bloodDk:'#5e0c12',gold:'#e0a458',goldHi:'#ffd166',
steel:'#5c7a99',steelHi:'#9db4c8',steelDk:'#26313f',bone:'#e8e3d5',dim:'#a89f8d',violet:'#7b2cbf',violetHi:'#c77dff',
green:'#7fb069',amber:'#e6a23c',info:'#6ea8d8',teal:'#4fb3a9',wood:'#4a3220',woodHi:'#7a5636',skin:'#d9a679',
skinDk:'#8a5a3b',silver:'#e6e9ef',armorW:'#d3d8e0',gutsA:'#1b1d26',gutsC:'#121319',hair:'#171310',foeA:'#55606e',
tabard:'#3a2f55',capA:'#43265e'};
var _cc={};
function rgb(h){var v=_cc[h];if(!v){v=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];_cc[h]=v;}return v;}
function col(h,a){var v=rgb(h);return 'rgba('+v[0]+','+v[1]+','+v[2]+','+(a===undefined?1:a)+')';}
function lit(h,f,a){var v=rgb(h);return 'rgba('+Math.round(v[0]+(255-v[0])*f)+','+Math.round(v[1]+(255-v[1])*f)+','+Math.round(v[2]+(255-v[2])*f)+','+(a===undefined?1:a)+')';}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(n){return Math.floor(Math.random()*n);}
function dist(ax,ay,bx,by){var dx=bx-ax,dy=by-ay;return Math.sqrt(dx*dx+dy*dy);}
function wrapA(a){while(a>Math.PI)a-=6.283185307;while(a<-Math.PI)a+=6.283185307;return a;}
function angLerp(a,b,t){return a+wrapA(b-a)*t;}
var DIFFS=[
{n:'Солдат',d:'Враги слабее, удары мягче. Сага о героях.',php:150,hp:.75,dmg:.7,cd:1.25,ex:0},
{n:'Наёмник',d:'Так, как задумано. Кровь за кровь.',php:120,hp:1,dmg:1,cd:1,ex:0},
{n:'Кошмар',d:'Клеймо жжёт. Враги быстры и беспощадны.',php:90,hp:1.3,dmg:1.35,cd:.8,ex:2}];
var STG=['ВНЕШНИЙ ДВОР','ВОРОТА','ТРОННЫЙ ЗАЛ','ЗАТМЕНИЕ'];
var COMBO=[[12,88,1.7,.07,.07,.16],[12,90,1.9,.07,.07,.18],[20,98,2.4,.11,.08,.30]];
/* ================= состояние ================= */
var state='menu',paused=false,act=1,stage=0,diff=1,muted=false;
var tAll=0,ts=1,hitstop=0,slowT=0,slowV=1,trauma=0,punch=0,flash=0,heat=0;
var zoom=1.05,zoomTo=1.05,camx=800,camy=640,camOX=0,camOY=0,shx=0,shy=0;
var player=null,allies=[],foes=[],boss=null;
var shots=[],parts=[],texts=[],decals=[],teles=[],wells=[],picks=[],ghosts=[],slashes=[];
var wave=[],waveI=0,stageT=0,reinf=8,need=0,done=0,clearing=false;
var gateOn=false,gateHp=320,gateMax=320;
var rage=0,rageT=0,comboN=0,comboT=0,score=0;
var stats={time:0,kills:0,maxc:0,taken:0},snap=null,check={act:1,stage:0};
var barkCd=0,hintT=0;
var cine=[],cineI=0,cineT=0,bars=0,barsTo=0;
var pendT=0,pendF=null;
var fadeA=0,fadeTo=0,fadeSp=3,fadeCb=null,busyGo=false,goCb=null;
var dlgOn=false,dlgT=0,dlgWho='',dlgTxt='',dlgCol=C.bone,dlgShown=0,dlgQ=[];
var banT=0,banA='',banB='';
var btns=[],mouse={x:640,y:360},keys={},isTouch=false;
var touchMove={active:false,id:-1,ox:0,oy:0,x:0,y:0};
var stars=[],spires=[],sigils=[],rocks=[],torches=[{x:400,y:500},{x:940,y:480},{x:1350,y:500},{x:210,y:790}];
(function seed(){
for(var i=0;i<90;i++)stars.push({x:rnd(0,AW),y:rnd(0,300),r:rnd(.6,1.9)});
var x=-40;while(x<AW+60){var w=rnd(26,72);spires.push({x:x,w:w,h:rnd(50,175)});x+=w*.8;}
for(i=0;i<10;i++)sigils.push({x:rnd(120,AW-120),y:rnd(490,830),s:rnd(24,50),p:rnd(0,6.28)});
for(i=0;i<6;i++)rocks.push({x:rnd(140,AW-140),y:rnd(300,430),p:rnd(0,6.28),s:rnd(14,30)});
})();
/* ================= звук ================= */
var AC=null,MG=null,noiseBuf=null,musicNodes=[],musicMode='siege',drumTimer=null,audioReady=false;
function initAudio(){
if(audioReady)return;audioReady=true;
try{var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;AC=new Ctx();}catch(e){AC=null;return;}
MG=AC.createGain();MG.gain.value=muted?0:.5;MG.connect(AC.destination);
var n=AC.sampleRate*1;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);var d=noiseBuf.getChannelData(0);
for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
startMusic();
drumTimer=setInterval(function(){if(!muted&&AC&&AC.state==='running'&&!document.hidden&&(state==='play'||state==='menu'))drum(state==='menu'?.3:.5);},musicMode==='siege'?2600:4200);
}
function resumeAudio(){if(AC&&AC.state==='suspended')AC.resume();}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d);}
function tone(f0,f1,dur,type,vol,dist){
if(!AC||muted)return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
env(g,t,.006,dur,vol);
if(dist){var ws=AC.createWaveShaper();var cvv=new Float32Array(256);for(var i=0;i<256;i++){var x=i/128-1;cvv[i]=Math.tanh(x*dist);}ws.curve=cvv;o.connect(ws);ws.connect(g);}else o.connect(g);
g.connect(MG);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,f0,f1,q){
if(!AC||muted||!noiseBuf)return;var t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),bp=AC.createBiquadFilter();
s.buffer=noiseBuf;s.loop=true;bp.type='bandpass';bp.Q.value=q||1;
bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
env(g,t,.005,dur,vol);s.connect(bp);bp.connect(g);g.connect(MG);s.start(t);s.stop(t+dur+.05);
}
function drum(v){if(!AC||muted)return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
o.type='sine';o.frequency.setValueAtTime(musicMode==='siege'?76:52,t);o.frequency.exponentialRampToValueAtTime(34,t+.24);
g.gain.setValueAtTime(.55*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.35);}
function sfx(n,v){
if(!AC||muted)return;v=v===undefined?1:v;
switch(n){
case 'swing':noise(.13,.22*v,1800,420,.8);break;
case 'hit':tone(180,52,.14,'sine',.4*v);noise(.07,.2*v,900,300,1);break;
case 'heavy':tone(120,34,.26,'sine',.5*v);noise(.16,.26*v,600,140,.7);break;
case 'clash':tone(3100,2500,.19,'triangle',.16*v);tone(4200,3600,.15,'sine',.1*v);noise(.1,.12*v,4000,2600,3);break;
case 'hurt':tone(115,62,.2,'sawtooth',.24*v,2);noise(.12,.14*v,500,180,1);break;
case 'dash':noise(.14,.18*v,500,2200,.9);break;
case 'bow':noise(.08,.18*v,2400,900,2);tone(240,150,.08,'triangle',.12*v);break;
case 'boom':tone(56,28,.9,'sine',.55*v);noise(.75,.3*v,320,60,.5);break;
case 'horn':tone(110,110,1.1,'sawtooth',.18*v,2.4);tone(165,165,1.1,'sawtooth',.1*v,2);break;
case 'roar':tone(96,52,.8,'sawtooth',.3*v,4);noise(.6,.18*v,420,150,.7);break;
case 'chime':tone(880,880,.16,'sine',.2*v);setTimeout(function(){tone(1320,1320,.22,'sine',.18*v);},90);break;
case 'orb':tone(1250,380,.2,'sine',.14*v);break;
case 'tele':tone(300,980,.24,'triangle',.14*v);noise(.22,.1*v,600,2600,1.4);break;
case 'ui':tone(1250,1080,.05,'sine',.12*v);break;
case 'death':tone(210,36,.45,'sawtooth',.22*v,2);noise(.3,.14*v,420,90,.6);break;
case 'warn':tone(440,440,.14,'square',.1*v);setTimeout(function(){tone(622,622,.16,'square',.09*v);},130);break;
case 'brand':noise(.55,.22*v,900,200,.6);tone(62,44,.55,'sine',.24*v);break;
case 'scream':tone(430,170,.65,'sawtooth',.18*v,2.5);break;
case 'fanfare':tone(110,110,.5,'sawtooth',.16*v,2.2);setTimeout(function(){tone(139,139,.5,'sawtooth',.16*v,2.2);},420);setTimeout(function(){tone(165,165,1,'sawtooth',.18*v,2.2);},840);break;
}
}
function startMusic(){
if(!AC)return;stopMusic();
var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=musicMode==='siege'?260:200;lp.connect(MG);
var freqs=musicMode==='siege'?[55,82.4,110.3]:[55,58.27,155.6];
var gains=musicMode==='siege'?[.16,.07,.06]:[.14,.11,.05];
for(var i=0;i<3;i++){
var o=AC.createOscillator();o.type='sine';o.frequency.value=freqs[i];
var g=AC.createGain();g.gain.value=gains[i];
var l=AC.createOscillator();l.frequency.value=.06+i*.04;var lg=AC.createGain();lg.gain.value=gains[i]*.5;
l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(lp);o.start();l.start();
musicNodes.push(o,l);
}
musicNodes.push(lp);
}
function stopMusic(){for(var i=0;i<musicNodes.length;i++){try{if(musicNodes[i].stop)musicNodes[i].stop();musicNodes[i].disconnect();}catch(e){}}musicNodes=[];}
function setMusic(m){if(musicMode===m)return;musicMode=m;if(AC){startMusic();if(drumTimer){clearInterval(drumTimer);drumTimer=setInterval(function(){if(!muted&&AC&&AC.state==='running'&&!document.hidden&&(state==='play'||state==='menu'))drum(.45);},m==='siege'?2600:4200);}}}
function setMute(m){muted=m;if(MG)MG.gain.setTargetAtTime(m?0:.5,AC.currentTime,.08);
document.getElementById('sndL').textContent=m?'Звук: выкл':'Звук: вкл';
document.getElementById('bSnd').classList.toggle('off',m);saveCfg();}
/* ================= настройки ================= */
function loadCfg(){try{var s=localStorage.getItem('berserk');if(s){var o=JSON.parse(s);diff=clamp(o.d|0,0,2);muted=!!o.m;}}catch(e){}}
function saveCfg(){try{localStorage.setItem('berserk',JSON.stringify({d:diff,m:muted}));}catch(e){}}
/* ================= ввод ================= */
function toLogical(cx,cy){var r=cv.getBoundingClientRect();return{x:(cx-r.left-offx)/scale,y:(cy-r.top-offy)/scale};}
function worldMouse(){return{x:(mouse.x-camOX)/zoom,y:(mouse.y-camOY)/zoom};}
addEventListener('resize',resize);
function resize(){
var r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
scale=Math.min(r.width/W,r.height/H);offx=(r.width-W*scale)/2;offy=(r.height-H*scale)/2;
}
cv.addEventListener('mousemove',function(e){var p=toLogical(e.clientX,e.clientY);mouse.x=p.x;mouse.y=p.y;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('mousedown',function(e){
e.preventDefault();initAudio();resumeAudio();
var p=toLogical(e.clientX,e.clientY);mouse.x=p.x;mouse.y=p.y;
if(e.button===0){if(clickBtn())return;if(state==='play'&&player&&!player.dead&&!player.locked)player.bufL=.28;else if(state==='cine'){cineT=Math.min(cineT,.08);dlgShown=9999;}}
else if(e.button===2){if(state==='play'&&player&&!player.dead&&!player.locked)player.bufH=.28;}
});
cv.addEventListener('touchstart',function(e){
e.preventDefault();isTouch=true;initAudio();resumeAudio();
for(var i=0;i<e.changedTouches.length;i++){
var t=e.changedTouches[i],p=toLogical(t.clientX,t.clientY);mouse.x=p.x;mouse.y=p.y;
if(clickBtn())continue;
if(state==='cine'){cineT=Math.min(cineT,.08);dlgShown=9999;continue;}
if(state!=='play')continue;
if(p.x<W*.45&&!touchMove.active){touchMove.active=true;touchMove.id=t.identifier;touchMove.ox=p.x;touchMove.oy=p.y;touchMove.x=p.x;touchMove.y=p.y;}
else if(player&&!player.dead&&!player.locked)player.bufL=.28;
}
},{passive:false});
cv.addEventListener('touchmove',function(e){
e.preventDefault();
for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i],p=toLogical(t.clientX,t.clientY);
if(touchMove.active&&t.identifier===touchMove.id){touchMove.x=p.x;touchMove.y=p.y;}else{mouse.x=p.x;mouse.y=p.y;}}
},{passive:false});
function touchEnd(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===touchMove.id){touchMove.active=false;touchMove.id=-1;}}}
cv.addEventListener('touchend',touchEnd);cv.addEventListener('touchcancel',touchEnd);
addEventListener('keydown',function(e){
initAudio();resumeAudio();
var k=e.code;keys[k]=true;
if(k==='Space'||k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight')e.preventDefault();
if(k==='KeyM'){setMute(!muted);sfx('ui');}
else if(k==='Escape'){if(state==='play'||state==='cine')setPause(!paused);}
else if(k==='KeyQ'){if(state==='play')tryRage();}
else if(k==='Space'||k==='ShiftLeft'||k==='ShiftRight'){if(state==='play'&&player&&!player.locked)player.bufD=.2;}
else if(k==='Enter'||k==='NumpadEnter'){if(state==='menu')startRun();else if(state==='dead')retry();else if(state==='win')again();else if(paused)setPause(false);}
else if(k==='KeyR'){if(state==='dead')retry();else if(state==='win')again();}
});
addEventListener('keyup',function(e){keys[e.code]=false;});
addEventListener('blur',function(){keys={};touchMove.active=false;if((state==='play'||state==='cine')&&!paused)setPause(true);});
document.addEventListener('visibilitychange',function(){if(document.hidden&&(state==='play'||state==='cine')&&!paused)setPause(true);});
function kd(){for(var i=0;i<arguments.length;i++)if(keys[arguments[i]])return true;return false;}
function clickBtn(){for(var i=0;i<btns.length;i++){var b=btns[i];if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h){onBtn(b.id);return true;}}return false;}
function onBtn(id){
sfx('ui');
if(id==='start')startRun();
else if(id.charAt(0)==='d'&&id.length===2){diff=parseInt(id.charAt(1),10);saveCfg();}
else if(id==='resume')setPause(false);
else if(id==='retry')retry();
else if(id==='menu')toMenu();
else if(id==='again')again();
else if(id==='pause')setPause(!paused);
else if(id==='heavy'){if(state==='play'&&player&&!player.locked)player.bufH=.28;}
else if(id==='dash'){if(state==='play'&&player&&!player.locked)player.bufD=.2;}
else if(id==='rage')tryRage();
}
function setPause(v){if(state!=='play'&&state!=='cine')return;paused=v;sfx('ui');}
document.getElementById('bPause').onclick=function(){if(state==='play'||state==='cine')setPause(!paused);};
document.getElementById('bSnd').onclick=function(){initAudio();resumeAudio();setMute(!muted);sfx('ui');};
document.getElementById('bDl').onclick=function(){
initAudio();resumeAudio();sfx('chime');
try{

function busy(a){return a.wind>0||a.hitw>0||a.rec>0||a.stag>0||a.dead;}

a.wind=w;a.hitw=0;a.rec=0;a.adir=a.aim;a.swing=-a.swing;return true;
}
function cancelAtk(a){a.wind=0;a.hitw=0;a.rec=Math.max(a.rec,.15);}
function hawks(){var o=[];if(player&&!player.dead)o.push(player);for(var i=0;i<allies.length;i++)if(!allies[i].dead)o.push(allies[i]);return o;}
function nearHawk(x,y){var b=null,bd=1e9,l=hawks();for(var i=0;i<l.length;i++){var d=dist(x,y,l[i].x,l[i].y)*(l[i].kind==='guts'?.75:1);if(d<bd){bd=d;b=l[i];}}return b;}
function nearFoe(x,y){var b=null,bd=1e9;for(var i=0;i<foes.length;i++){var f=foes[i];if(f.dead||f.rout)continue;var d=dist(x,y,f.x,f.y);if(d<bd){bd=d;b=f;}}
if(boss&&!boss.dead&&boss.on){var d2=dist(x,y,boss.x,boss.y);if(d2<bd)b=boss;}return b;}

function strike(a){
if(a.kind==='archer'||a.kind==='judeau'){
var t=a.team==='foe'?nearHawk(a.x,a.y):nearFoe(a.x,a.y);
if(t){var kn=a.kind==='judeau';var lead=Math.atan2(t.y+t.vy*.22-a.y,t.x+t.vx*.22-a.x);
shots.push({x:a.x,y:a.y-36,vx:Math.cos(lead)*(kn?500:430),vy:Math.sin(lead)*(kn?500:430),r:9,dmg:a.dmg,team:a.team,life:2.6,orb:false,knife:kn,c:C.steelHi});

}

if(a.team==='hawk'){for(i=0;i<foes.length;i++)if(!foes[i].dead&&!foes[i].rout)targets.push(foes[i]);if(boss&&!boss.dead&&boss.on)targets.push(boss);}
else targets=hawks();
var dm=a.dmg,isP=a.kind==='guts';
if(isP&&rageT>0)dm*=1.6;
var hits=0,total=0;
for(i=0;i<targets.length;i++){
var t2=targets[i],dd=dist(a.x,a.y,t2.x,t2.y);
if(dd>a.rng+t2.r)continue;
var ang=Math.atan2(t2.y-a.y,t2.x-a.x);
if(Math.abs(wrapA(ang-a.adir))>a.arc*.5+.2)continue;

if(hurt(t2,dm,a.x,a.y,a.heavy,a)){hits++;total+=Math.max(0,before-t2.hp);if(t2.team==='foe')spark(t2.x,t2.y-34,a.heavy?C.goldHi:C.bone,9);}
}

if(gd<a.rng+85&&Math.abs(wrapA(ga-a.adir))<a.arc*.5+.3){hitGate(dm*(a.heavy?3.5:1),a.heavy);hits++;}
}
addSlash(a.x,a.y-34,a.adir,a.arc,a.rng,(isP&&rageT>0)?C.bloodHi:a.scol,a.heavy);
sfx('swing',a.team==='foe'?.5:.7);
a.kx+=Math.cos(a.adir)*(a.heavy?240:110);a.ky+=Math.sin(a.adir)*(a.heavy?240:110);

function hurt(t,amount,fx,fy,heavy,src){

var blocked=false;
if(t.kind==='shield'&&!heavy){
var pierce=src&&src.kind==='guts'&&rageT>0;
var ang=Math.abs(wrapA(Math.atan2(fy-t.y,fx-t.x)-t.aim));
if(!pierce&&ang<1.15){amount*=.15;blocked=true;}
}
if(t.kind==='femto'&&t.vuln>0)amount*=1.5;
t.hp-=amount;t.flash=.18;
var dx=t.x-fx,dy=t.y-fy,dl=Math.sqrt(dx*dx+dy*dy)||1;dx/=dl;dy/=dl;
var kb=blocked?70:(heavy?260:130);
t.kx+=dx*kb;t.ky+=dy*kb;
blood(t.x,t.y,dx,dy);
if(blocked){addText(t.x,t.y,'БЛОК',C.steelHi,14);spark(t.x,t.y-34,C.steelHi,8);sfx('clash',.7);}
else if(t.team==='foe')addText(t.x,t.y,String(Math.round(amount)),heavy?C.goldHi:C.bone,heavy?20:15);
else addText(t.x,t.y,'-'+Math.round(amount),C.bloodHi,16);
if(heavy&&t.team==='foe'&&!blocked){
t.stag=Math.max(t.stag,.35);cancelAtk(t);
if(t.kind==='captain'){t.chargeT=0;t.slamT=0;t.teleT=0;}
}
if(t.kind==='guts')playerHurt(amount);
if(t.kind==='femto'&&!blocked&&t.resist<=0&&t.stag<=0){
t.poise+=heavy?34:8;
if(t.poise>=100){t.poise=0;t.resist=5;t.stag=1;t.an='';cancelAtk(t);addText(t.x,t.y,'ОГЛУШЁН!',C.goldHi,22);sfx('clash',1);}
}
if(t.hp<=0){
t.hp=0;
if(t.team==='hawk'&&t.kind!=='guts'){t.hp=t.hpMax*.15;t.retreat=3.5;cancelAtk(t);addText(t.x,t.y,'РАНЕН!',C.amber,15);}
else kill(t);
}

}

/* ================= цикл ================= */
var last=performance.now();
function frame(now){
var raw=Math.min((now-last)/1000,.05);last=now;tAll+=raw;
if(fadeA!==fadeTo){
fadeA=fadeA<fadeTo?Math.min(fadeTo,fadeA+fadeSp*raw):Math.max(fadeTo,fadeA-fadeSp*raw);
if(fadeA===fadeTo&&fadeCb){var c=fadeCb;fadeCb=null;c();}
}
if(!paused){
hitstop=Math.max(0,hitstop-raw);slowT=Math.max(0,slowT-raw);
var tgt=hitstop>0?.07:(slowT>0?slowV:1);
ts=hitstop>0?tgt:lerp(ts,tgt,1-Math.exp(-14*raw));
var dt=raw*ts;
flash=Math.max(0,flash-3*raw);trauma=Math.max(0,trauma-1.8*raw);punch=Math.max(0,punch-.5*raw);
bars=lerp(bars,barsTo,1-Math.exp(-7*raw));
if(banT>0)banT-=raw;
if(dlgOn){dlgShown+=raw*34;dlgT-=dt;if(dlgT<=0){if(dlgQ.length){var n=dlgQ.shift();showLine(n[0],n[1],n[2],n[3]);}else dlgOn=false;}}
stepFx(dt);
if(state==='menu'){camx=800+Math.sin(tAll*.12)*50;camy=640+Math.sin(tAll*.07)*18;zoomTo=1.05;}
else if(state==='play'||state==='cine'){
if(state==='play'){
stats.time+=dt;hintT+=dt;
if(act===1)waveLogic(dt);
if(pendT>0){pendT-=dt;if(pendT<=0&&pendF){var pf=pendF;pendF=null;pf();}}
}else{
cineT-=dt;
if(cineT<=0){if(cineI<cine.length){var s=cine[cineI];cineI++;s.f();cineT=s.w;}else if(state==='cine')state='play';}
}
barkCd=Math.max(0,barkCd-dt);comboT=Math.max(0,comboT-dt);if(comboT<=0)comboN=0;rageT=Math.max(0,rageT-dt);
if(player){stepActor(player,dt);if(!player.dead&&player.stag<=0&&player.spawn<=0)aiPlayer(dt);}
for(var i=0;i<allies.length;i++){var a=allies[i];stepActor(a,dt);if(!a.dead&&a.stag<=0&&a.spawn<=0)aiAlly(a,dt);}
for(i=foes.length-1;i>=0;i--){var f=foes[i];stepActor(f,dt);
if(f.dead&&f.fade<=0){foes.splice(i,1);continue;}
if(!f.dead&&f.stag<=0&&f.spawn<=0)aiFoe(f,dt);}
if(boss){stepActor(boss,dt);if(!boss.dead&&boss.stag<=0)aiBoss(dt);if(boss.dead&&boss.fade<=0)boss=null;}
separate();stepShots(dt);stepWells(dt);stepPicks(dt);
}

camx=lerp(camx,tx,1-Math.exp(-5*raw));camy=lerp(camy,ty,1-Math.exp(-5*raw));
}
}
var hw=W*.5/zoom,hh=H*.5/zoom;
camx=clamp(camx,hw,AW-hw);camy=clamp(camy,hh,AH-hh);

function stepActor(a,dt){
a.spawn=Math.max(0,a.spawn-dt);a.flash=Math.max(0,a.flash-dt);a.inv=Math.max(0,a.inv-dt);a.stag=Math.max(0,a.stag-dt);
if(a.dead){a.fade=Math.max(0,a.fade-dt*(a.kind==='femto'?.7:1.1));return;}
if(a.wind>0){a.wind-=dt;if(a.wind<=0){a.hitw=a.at;strike(a);}}
else if(a.hitw>0){a.hitw-=dt;if(a.hitw<=0)a.rec=a.rt;}
else if(a.rec>0)a.rec-=dt;
a.x+=(a.vx+a.kx)*dt;a.y+=(a.vy+a.ky)*dt;
var kd2=Math.max(0,1-1100*dt/(Math.sqrt(a.kx*a.kx+a.ky*a.ky)||1));

function box(w,h){
ctx.fillStyle='rgba(8,5,15,.85)';ctx.fillRect(0,0,W,H);
var x=(W-w)/2,y=(H-h)/2;
rr(x,y,w,h,4);ctx.fillStyle='rgba(13,8,20,.97)';ctx.fill();
ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.stroke();
return{x:x,y:y,w:w,h:h};
}
